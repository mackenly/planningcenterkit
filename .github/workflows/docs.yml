name: Docs

on:
    push:
        branches:
            - main
        paths:
            - 'site/**'
            - 'spec/**'
            - 'scripts/generate-reference.ts'
            - 'README.md'
            - '.github/workflows/docs.yml'
    workflow_dispatch:

permissions:
    contents: read

# One deployment at a time; don't cancel a deployment that's already running.
concurrency:
    group: docs-deploy
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            # Full history: "Last updated" dates and the sitemap come from git.
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: '24.x'
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      site/package-lock.json
            - run: npm ci
            - run: npm ci
              working-directory: site
            # Generates the reference pages from spec/, then builds the site.
            - run: npm run docs:build
            - uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: site
                  command: deploy
